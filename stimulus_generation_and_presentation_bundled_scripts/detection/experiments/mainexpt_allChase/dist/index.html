    <head>
        <title>Deploy</title>
        
        <link rel="stylesheet" href="https://unpkg.com/jspsych@7.0.0/css/jspsych.css", rel="stylesheet" type="text/css">

        <style>
            .jspsych-display-element {
                font-size: 24px;
            }
            canvas {
                
                /* horizontal alignment */
                display: block;
                margin: 0 auto;

                /* vertical alignment */
                /*padding-top: 200px; */
                border: 2px solid #000;
            }

            body {
                font-family: 'Arial', sans-serif;
                font-size: 24px;
            }
            .jspsych-btn {
                font-size: 20px; /* Adjust the size as needed */
            }
            .sv_body {
                font-family: "Open Sans", "Arial", sans-serif;
                font-size: 24px;
                color: #000;
            }
            .sv_main .sv_container .sv_body .sv_nav .sv_complete_btn{
                padding: 6px 12px;
                margin: 0 16px;
                font-size: 20px;
                font-weight: 400;
                font-family: "Open Sans", "Arial", sans-serif;
                line-height: 1.4;
                text-align: center;
                float: left;
                position: relative;
                left: 50%;
                white-space: nowrap;
                vertical-align: middle;
                background-image: none;
                border: 1px solid transparent;
                border-radius: 4px;
                color: #333;
                background-color: #fff;
                border-color: #ccc; /* Center the button horizontally */
            }
            .sv_main .sv_container .sv_body .sv_p_root .sv_q input[type=radio]{
                width: 0.5em;
                height: 0.5em;
            }
            .video-border {
                border: 2px solid #000; /* Set the border style, adjust color and width as needed */
            }
            input[type='radio'] {
                -webkit-transform: scale(1.5); /* Safari and Chrome */
                -moz-transform: scale(1.5); /* Firefox */
                -ms-transform: scale(1.5); /* IE 9 */
                -o-transform: scale(1.5); /* Opera */
                transform: scale(1.5); /* General */
            }
            .slider input[type="range"] {
                appearance: none;
                width: 80%;
                height: 12px;
                border-radius: 12px;  
                background: rgb(221,221,221);
                outline: none;
            }
            /* The slider handle (use -webkit- (Chrome, Opera, Safari, Edge) */
            .slider input[type="range"]::-webkit-slider-thumb {
                appearance: none;
                width: 12px;
                height: 24px;
                background: #fff;
                outline: 2px solid rgb(102,102,102);
            }
        </style>
    <script defer src="runtime.bundle.js"></script><script defer src="main.bundle.js"></script></head>
